name: Build Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 安装打包依赖 (ldid)
      run: brew install ldid dpkg

    - name: 安装 Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

    - name: 编译生成 Dylib
      env:
        THEOS: /Users/runner/theos
      run: |
        make FINALPACKAGE=1
        mkdir -p output_dylib
        find . -name "*.dylib" -not -path "*/.*" -exec cp {} output_dylib/ \;
        
        # 核心修复：移除云端签名，防止 TrollFools 签名冲突
        codesign --remove-signature output_dylib/*.dylib || true

    - name: 上传 Dylib 产物
      uses: actions/upload-artifact@v4
      with:
        name: CustomAutoClicker-dylib
        path: output_dylib/*
